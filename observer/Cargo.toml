[package]
name = "observer"
version = "0.1.0"
edition = "2021"
description = "LinkNotifier Observer: local meeting note taker (Teams-compatible) built on pure-Rust models"
publish = false

[workspace]
members = [".", "crates/smollm2"]
exclude = ["vendor"]

# needle-rs crates inherit these from their workspace root, but Cargo resolves
# them against this workspace because vendor/ sits inside it. Values copied
# from vendor/needle-rs/Cargo.toml.
[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/geekgineer/needle-rs"
homepage = "https://github.com/geekgineer/needle-rs"
rust-version = "1.87"

[dependencies]
whistle = { path = "vendor/Cactus_Whistle-Pure_Rust" }
minilm = { path = "vendor/paraphrase-multilingual-MiniLM-L12-v2_PureRust" }
mobileclip-s0 = { path = "vendor/MobileCLIP-S0_PureRust" }
needle-infer = { path = "vendor/needle-rs/crates/needle-infer", features = ["parallel"] }
smollm2 = { path = "crates/smollm2" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind, not abort: a model that panics on one input must not end the session
panic = "unwind"
debug = false
